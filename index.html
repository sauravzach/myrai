<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Self-contained: every line of logic below is inline, nothing is ever
     fetched, and nothing here can leave the page — connect-src 'none' rules
     out any network call even if that ever changed by accident. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>You're Not On The List</title>
<style>
  :root {
    --bg: #f6f1e7;
    --ink: #1d1a16;
    --muted: #6b645a;
    --accent: #b3261e;
    --brass: #c9a227;
    --suit: #22201d;
    --card: #fffdf8;
    --line: #e4dccd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15130f;
      --ink: #f1ebe0;
      --muted: #a39a8c;
      --accent: #ff6b5e;
      --brass: #e0bb45;
      --suit: #3a3631;
      --card: #1f1c17;
      --line: #342f28;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  /* Kills the double-tap-to-zoom gesture (the actual bug report) without
     touching pinch-zoom or the viewport's scale limits — unlike
     user-scalable=no, this doesn't take zoom away from anyone who needs it. */
  html { touch-action: manipulation; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.55 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 32px 16px;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  h1 { font-size: clamp(28px, 8vw, 38px); line-height: 1.1; margin: 0 0 8px; letter-spacing: -0.02em; }
  .lede { color: var(--muted); margin: 0 auto 22px; max-width: 30em; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px;
    text-align: left;
  }
  .eyebrow { font-size: 12px; letter-spacing: 0.04em; color: var(--brass); font-weight: 700; margin: 0 0 8px; }
  .riddle { font-size: 19px; line-height: 1.4; margin: 0 0 18px; }

  input {
    width: 100%;
    font: inherit;
    font-size: 16px; /* stops iOS zooming the page on focus */
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    margin: 0 0 12px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  button {
    font: inherit;
    font-weight: 700;
    font-size: 16px;
    width: 100%;
    padding: 13px 14px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: var(--accent);
    color: var(--card);
  }
  button:active { transform: scale(0.98); }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); margin-top: 10px; }

  .verdict-tag { font-size: 12px; letter-spacing: 0.04em; color: var(--accent); font-weight: 700; margin: 0 0 8px; }
  .verdict { font-size: 20px; font-weight: 800; margin: 0 0 10px; }
  .verdict-sub { color: var(--muted); margin: 0; }
  .echo { color: var(--muted); font-size: 13px; margin: 10px 0 0; font-style: italic; }

  .tally { color: var(--muted); font-size: 13px; margin-top: 18px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>You're not on the list.</h1>
  <p class="lede">But there's a way in. Maybe. Solve the riddle.</p>

  <section class="card" id="ask">
    <p class="eyebrow">PROVE YOU BELONG HERE</p>
    <p class="riddle" id="riddle-text"></p>
    <input id="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Your answer…" aria-label="Your answer to the riddle">
    <button id="submit">Submit and find out</button>
  </section>

  <section class="card" id="result" hidden>
    <p class="verdict-tag" id="verdict-tag">VERDICT</p>
    <p class="verdict" id="verdict-text"></p>
    <p class="verdict-sub" id="verdict-sub"></p>
    <p class="echo" id="echo" hidden></p>
    <button class="ghost" id="retry">Try a different riddle</button>
  </section>

  <p class="tally" id="tally" hidden></p>
</main>
<script>
(function () {
  'use strict';

  // Genuine, solvable riddles — real stakes, nothing that hints this is a
  // bit. These are the only ones a first-time visitor can be shown: the
  // whole prank depends on the setup being played completely straight.
  var REAL_RIDDLES = [
    'The person who makes it does not want it. The person who buys it does not use it. The person who uses it does not know it. What is it?',
    'I speak without a mouth and hear without ears. I have no body, but I come alive with the wind. What am I?',
    'Forward I am heavy. Backward I am not. What am I?',
    'The more you take, the more you leave behind. What am I?',
    'A man describes his daughter: "She has as many brothers as sisters, but each brother has only half as many brothers as sisters." How many sons and daughters does he have?',
    'Two fathers and two sons go fishing. Each catches exactly one fish, yet only three fish are caught in total. How?'
  ];
  // Deliberately impossible — only shown once someone has already been
  // rejected a couple of times and the bit can afford to show a little.
  var ABSURD_RIDDLES = [
    'What is the precise square root of the feeling you get when a bouncer says "maybe"?',
    'Spell "impossible" using only the letters found in the word "no".',
    'If a riddle rejects you in a forest and no one is around to hear it, were you ever really on the list?',
    'In exactly one word, using only vowels, explain why you deserve to get in.'
  ];

  // Escalating rejections, bucketed by how many times this browser has
  // tried. A few exact milestones get their own line as a small reward for
  // real commitment to the bit.
  var BUCKETS = [
    ['That answer was correct. It didn’t matter.', 'Right answer. Wrong universe, apparently.', 'You solved it. You are still not on the list.'],
    ['We stopped checking after the first riddle, if we’re honest.', 'The list was never real. Neither is your chance.', 'Bold of you to assume there was ever a list.', 'The bouncer is very impressed. The bouncer still says no.'],
    ['Most people give up by now. You are not most people. Still no.', 'We respect the commitment. The answer remains no.', 'You could be solving actual world problems right now. Instead: this.'],
    ['There is a betting pool on when you’ll stop. You’re currently costing someone money.', 'Legend says one person got in once. It wasn’t them either.', 'At this point you basically work here. Unpaid. Still not on the list.']
  ];
  var MILESTONES = {
    10: 'Ten riddles. Ten rejections. This is basically a tradition now. Still no.',
    25: 'Twenty-five. We printed you a certificate. It says NO in a nice font.',
    50: 'Fifty attempts. Somewhere, a bouncer is quietly proud of you. The answer is still no.',
    100: 'One hundred. Okay. Genuinely well played. You are still not on the list.'
  };
  var ECHO_CHANCE = 0.4; // only sometimes mock the actual answer, so it stays a surprise

  var KEY = 'notonthelist-attempts';
  function loadCount() { try { return Number(localStorage.getItem(KEY)) || 0; } catch (e) { return 0; } }
  function saveCount(v) { try { localStorage.setItem(KEY, String(v)); } catch (e) {} }
  var count = loadCount();

  var els = {
    ask: document.getElementById('ask'),
    riddleText: document.getElementById('riddle-text'),
    answer: document.getElementById('answer'),
    submit: document.getElementById('submit'),
    result: document.getElementById('result'),
    tag: document.getElementById('verdict-tag'),
    verdict: document.getElementById('verdict-text'),
    sub: document.getElementById('verdict-sub'),
    echo: document.getElementById('echo'),
    retry: document.getElementById('retry'),
    tally: document.getElementById('tally')
  };

  var lastRiddle = -1;
  function nextRiddle() {
    // The first couple of riddles anyone ever sees are always real — the
    // absurd ones only enter the pool once a rejection or two has already
    // landed, so the setup never gives itself away.
    var pool = count < 2 ? REAL_RIDDLES : REAL_RIDDLES.concat(ABSURD_RIDDLES);
    var i;
    do { i = Math.floor(Math.random() * pool.length); } while (i === lastRiddle && pool.length > 1);
    lastRiddle = i;
    els.riddleText.textContent = pool[i];
  }

  function pickRejection(n) {
    if (MILESTONES[n]) return MILESTONES[n];
    var bucket = BUCKETS[Math.min(BUCKETS.length - 1, Math.floor((n - 1) / 3))];
    return bucket[Math.floor(Math.random() * bucket.length)];
  }

  function showAsk() {
    els.result.hidden = true;
    els.ask.hidden = false;
    els.answer.value = '';
    nextRiddle();
    els.answer.focus();
  }

  function submit() {
    count++;
    saveCount(count);
    var typed = els.answer.value.trim();

    els.ask.hidden = true;
    els.result.hidden = false;
    els.tag.textContent = 'CONSULTING THE LIST…';
    els.verdict.textContent = '';
    els.sub.textContent = '';
    els.echo.hidden = true;

    // A short, deliberate pause — the theater is the whole point.
    window.setTimeout(function () {
      els.tag.textContent = 'VERDICT #' + count;
      els.verdict.textContent = 'Not on the list.';
      els.sub.textContent = pickRejection(count);
      if (typed && Math.random() < ECHO_CHANCE) {
        var shown = typed.length > 80 ? typed.slice(0, 80) + '…' : typed;
        els.echo.textContent = 'Your answer, for the record: “' + shown + '”';
        els.echo.hidden = false;
      }
      els.tally.hidden = false;
      els.tally.textContent = count === 1 ? 'That was riddle #1.' : 'That was riddle #' + count + '.';
    }, 650);
  }

  els.submit.addEventListener('click', submit);
  els.answer.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
  els.retry.addEventListener('click', showAsk);

  els.tally.hidden = count === 0;
  if (count > 0) els.tally.textContent = 'You’ve tried ' + count + ' time' + (count === 1 ? '' : 's') + '. Welcome back.';
  nextRiddle();
})();
</script>
</body>
</html>

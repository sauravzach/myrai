<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Self-contained: every line of logic below is inline, nothing is ever
     fetched, and nothing here can leave the page — connect-src 'none' rules
     out any network call even if that ever changed by accident. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>You're Not On The List</title>
<style>
  :root {
    --bg: #f6f1e7;
    --ink: #1d1a16;
    --muted: #6b645a;
    --accent: #b3261e;
    --brass: #c9a227;
    --suit: #22201d;
    --card: #fffdf8;
    --line: #e4dccd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15130f;
      --ink: #f1ebe0;
      --muted: #a39a8c;
      --accent: #ff6b5e;
      --brass: #e0bb45;
      --suit: #3a3631;
      --card: #1f1c17;
      --line: #342f28;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.5 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 360px; text-align: center; }
  h1 { font-size: clamp(24px, 7vw, 32px); line-height: 1.15; margin: 0 0 6px; letter-spacing: -0.02em; }
  .lede { color: var(--muted); margin: 0 0 16px; }
  canvas {
    width: 100%;
    aspect-ratio: 2 / 3;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    touch-action: manipulation;
    cursor: pointer;
  }
  .fine { color: var(--muted); font-size: 13px; margin-top: 14px; }
</style>
</head>
<body>
<main>
  <h1>You're not on the list.</h1>
  <p class="lede">So sneak past the bouncers instead.</p>
  <canvas id="g" width="320" height="480" aria-label="Tap-to-fly game: guide the dot between the velvet ropes without touching them"></canvas>
  <p class="fine">Tap, click, or press space to fly. One touch is all it takes to get bounced.</p>
</main>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('g');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  var TAU = Math.PI * 2;

  // Read the theme's colours once, and again if the OS theme flips mid-game.
  var C = {};
  function readColours() {
    var s = getComputedStyle(document.documentElement);
    ['bg', 'ink', 'muted', 'accent', 'brass', 'suit', 'card', 'line'].forEach(function (k) {
      C[k] = s.getPropertyValue('--' + k).trim();
    });
  }
  readColours();
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColours);
  }

  var BEST_KEY = 'notonthelist-best';
  function loadBest() { try { return Number(localStorage.getItem(BEST_KEY)) || 0; } catch (e) { return 0; } }
  function saveBest(v) { try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) {} }
  var best = loadBest();

  var GRAVITY = 0.42, FLAP = -7.2, GAP = 132, POST_W = 46, SPACING = 210;
  var player, posts, score, speed, state, shake;

  function reset() {
    player = { x: 78, y: H / 2, vy: 0, r: 11 };
    posts = [{ x: W + 40, gapY: H / 2 }];
    score = 0;
    speed = 2.6;
    shake = 0;
    state = 'ready'; // ready -> playing -> dead
  }
  reset();

  function flap() {
    if (state === 'ready') state = 'playing';
    if (state === 'dead') { reset(); return; }
    player.vy = FLAP;
  }
  canvas.addEventListener('pointerdown', flap);
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space') { e.preventDefault(); flap(); }
  });

  function step() {
    if (state === 'playing') {
      player.vy += GRAVITY;
      player.y += player.vy;

      for (var i = 0; i < posts.length; i++) posts[i].x -= speed;
      if (posts[posts.length - 1].x < W - SPACING) {
        posts.push({ x: W + POST_W, gapY: 70 + Math.random() * (H - 140) });
      }
      // A post fully offscreen has been passed: score it and drop it.
      if (posts[0].x < -POST_W) { posts.shift(); score++; speed = 2.6 + Math.min(score * 0.06, 2.4); }

      for (var j = 0; j < posts.length; j++) {
        var p = posts[j];
        var hitsX = player.x + player.r > p.x && player.x - player.r < p.x + POST_W;
        var hitsGap = player.y - player.r > p.gapY - GAP / 2 && player.y + player.r < p.gapY + GAP / 2;
        if (hitsX && !hitsGap) die();
      }
      if (player.y - player.r < 0 || player.y + player.r > H) die();
    } else if (shake > 0) {
      shake -= 1;
    }

    draw();
    requestAnimationFrame(step);
  }

  function die() {
    state = 'dead';
    shake = 10;
    if (score > best) { best = score; saveBest(best); }
  }

  function fillRound(x, y, w, h, r) {
    if (h <= 0) return;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, Math.min(r, w / 2, h / 2));
    ctx.fill();
  }

  function draw() {
    // A brief camera-shake on death sells the "bounced" impact.
    var dx = shake > 0 ? (Math.random() - 0.5) * shake : 0;
    ctx.save();
    ctx.translate(dx, 0);

    ctx.fillStyle = C.card;
    ctx.fillRect(-20, 0, W + 40, H);

    // Each obstacle is a brass-capped rope post pair, one hanging from the
    // top, one rising from the bottom, with a gap to fly through between.
    for (var i = 0; i < posts.length; i++) {
      var p = posts[i];
      var topH = p.gapY - GAP / 2, botY = p.gapY + GAP / 2;
      ctx.fillStyle = C.suit;
      fillRound(p.x, 0, POST_W, topH, 8);
      fillRound(p.x, botY, POST_W, H - botY, 8);
      ctx.fillStyle = C.brass;
      ctx.beginPath(); ctx.arc(p.x + POST_W / 2, topH, 9, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(p.x + POST_W / 2, botY, 9, 0, TAU); ctx.fill();
    }

    ctx.fillStyle = C.accent;
    ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, TAU); ctx.fill();

    // A light halo keeps the score legible even when a dark post scrolls
    // directly behind it — both the digit and the posts are near-black.
    ctx.font = '700 28px ui-rounded, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = C.card;
    ctx.lineWidth = 6;
    ctx.strokeText(String(score), W / 2, 46);
    ctx.fillStyle = C.ink;
    ctx.fillText(String(score), W / 2, 46);

    if (state !== 'playing') {
      bubble(state === 'ready' ? 'TAP TO SNEAK IN' : 'NOPE.', state === 'ready' ? 'Fly between the ropes.' : ('Best: ' + best));
    }

    ctx.restore();
  }

  function bubble(title, sub) {
    var bw = 240, bh = 92, bx = W / 2 - bw / 2, by = H / 2 - bh / 2;
    ctx.fillStyle = C.card;
    ctx.strokeStyle = C.line;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(bx, by, bw, bh, 16);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = C.accent;
    ctx.font = '800 22px system-ui, sans-serif';
    ctx.fillText(title, W / 2, by + 38);
    ctx.fillStyle = C.muted;
    ctx.font = '400 14px system-ui, sans-serif';
    ctx.fillText(sub, W / 2, by + 64);
  }

  requestAnimationFrame(step);
})();
</script>
</body>
</html>

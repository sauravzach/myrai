name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Page sanity checks
        run: node scripts/check.mjs
      - name: Lint HTML
        run: npx --yes htmlhint@1.1.4 index.html
